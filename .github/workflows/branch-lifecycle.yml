name: Branch Lifecycle

on:
  # This workflow is loaded from and always checks out the owner-reviewed
  # default branch. PR/base/head revisions are API data and are never executed.
  pull_request_target:
    branches:
      - develop
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review
      - closed
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "仅定点重试这个已合并 develop Stage PR 编号"
        required: true
        type: string

permissions: {}

concurrency:
  group: branch-lifecycle-${{ github.repository_id }}-${{ github.event.pull_request.number || inputs.pr_number || 'audit' }}
  cancel-in-progress: false

jobs:
  audit:
    name: sunset 审计（只读 PR/Issue）
    if: >-
      ${{ (github.event_name == 'pull_request_target' && github.event.action != 'closed') ||
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' &&
           github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: 运行可信 sunset 审计器
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/check_branch_lifecycle.py --mode audit

  finalize:
    name: merged Stage 的 Issue 与分支 finalizer
    if: >-
      ${{ (github.event_name == 'pull_request_target' && github.event.action == 'closed') ||
          (github.event_name == 'workflow_dispatch' &&
           inputs.pr_number != '' &&
           github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: 完整复验后执行可信 finalizer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/check_branch_lifecycle.py --mode finalize

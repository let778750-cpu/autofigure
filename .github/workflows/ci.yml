name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      run_powerpoint_live:
        description: 在带 Microsoft PowerPoint 的受控自托管 Windows runner 上执行 COM 门禁
        required: true
        type: boolean
        default: false
      case_run_dir:
        description: 需要验证的案例目录（必须位于 examples/）
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-tests:
    name: portable-tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python:
          - "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: 安装依赖（Ubuntu，不安装 Windows-only pywin32）
        if: runner.os == 'Linux'
        shell: bash
        run: |
          grep -v -E '^pywin32([<>=!~]|$)' requirements.txt > "$RUNNER_TEMP/requirements-linux.txt"
          python -m pip install --upgrade pip
          python -m pip install -r "$RUNNER_TEMP/requirements-linux.txt"
      - name: 安装依赖（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: 静态检查
        run: python -m ruff check tools tests benchmarks
      - name: 字节码编译（外部 pycache）
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/autofigure-pycache
        run: python -m compileall -q tools tests
      - name: 单元与离线集成测试
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/autofigure-pycache
        run: python -m pytest tests -q --basetemp "${{ runner.temp }}/autofigure-basetemp"
      - name: 测试不得改写跟踪内容
        shell: bash
        run: git diff --exit-code

  case-contracts:
    name: case-contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: 安装跨平台依赖
        shell: bash
        run: |
          grep -v -E '^pywin32([<>=!~]|$)' requirements.txt > "$RUNNER_TEMP/requirements-linux.txt"
          python -m pip install --upgrade pip
          python -m pip install -r "$RUNNER_TEMP/requirements-linux.txt"
      - name: 检查案例索引与合同
        run: python -m tools cases --check
      - name: 检查负面回声与过期叙述
        run: python -m tools hygiene
      - name: 基准 fixture 与确定性修复校验
        run: |
          python benchmarks/bootstrap/repair_seed.py --check
          python -c "from benchmarks.suites.pipeline_performance import verify_fixture; verify_fixture(); print('benchmark fixture ok')"
      - name: 案例证据哈希绑定一致性（字节透传不变量）
        run: python -m tools renormalize --all --check

  powerpoint-live-gate:
    name: PowerPoint COM 人工门禁
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_powerpoint_live }}
    runs-on:
      - self-hosted
      - Windows
      - X64
      - powerpoint
    environment: scientific-release
    env:
      CASE_RUN_DIR: ${{ inputs.case_run_dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: 安装 Windows 依赖
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: 限定案例路径
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CASE_RUN_DIR)) {
            throw 'case_run_dir is required when run_powerpoint_live=true'
          }
          $casePath = (Resolve-Path -LiteralPath $env:CASE_RUN_DIR).Path
          $examplesRoot = (Resolve-Path -LiteralPath 'examples').Path + [IO.Path]::DirectorySeparatorChar
          if (-not $casePath.StartsWith($examplesRoot, [StringComparison]::OrdinalIgnoreCase)) {
            throw "case_run_dir must stay inside examples/: $casePath"
          }
          "RESOLVED_CASE_RUN_DIR=$casePath" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: PowerPoint COM fresh render
        shell: pwsh
        env:
          # runner context 在 job 级 env 不可用(GitHub schema),移至 step 级。
          FRESH_RENDER: ${{ runner.temp }}\autofigure-powerpoint-fresh.png
        run: >-
          python -c "import os; from pathlib import Path; from tools.core import common;
          from tools.pipeline.render_export import render; run=common.open_run(Path(os.environ['RESOLVED_CASE_RUN_DIR']));
          meta=run.load_meta(); render(run.pptx_path, Path(os.environ['FRESH_RENDER']),
          int(meta['width']), int(meta['height']))"
      - name: strict + live evidence 门禁
        shell: pwsh
        run: python -m tools check $env:RESOLVED_CASE_RUN_DIR --skip-ocr --profile strict --require-live
      - name: 汇集门禁报告
        if: always()
        shell: pwsh
        run: |
          $report = Join-Path $env:RESOLVED_CASE_RUN_DIR 'qa\check-report.md'
          if (Test-Path -LiteralPath $report) {
            Copy-Item -LiteralPath $report -Destination "$env:RUNNER_TEMP\autofigure-check-report.md"
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: powerpoint-live-evidence
          path: |
            ${{ runner.temp }}/autofigure-powerpoint-fresh.png
            ${{ runner.temp }}/autofigure-check-report.md
          if-no-files-found: error
          retention-days: 30

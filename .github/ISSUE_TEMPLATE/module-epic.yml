name: 模块 Epic
description: 为一个可独立演进的模块冻结目标、阶段、证据和退出边界
title: "[Epic] "
labels:
  - "type:epic"
body:
  - type: dropdown
    id: primary_area
    attributes:
      label: Primary Area
      description: 只能选择七个规范 Area；Project Area 与后续标签必须镜像该值。
      options:
        - "area:visual-grammar"
        - "area:typography"
        - "area:member-geometry"
        - "area:microasset-fidelity"
        - "area:asset-representation"
        - "area:qa-repair"
        - "area:route-parity"
    validations:
      required: true

  - type: input
    id: module
    attributes:
      label: 模块与稳定边界
      description: 使用一个可长期识别、但不会对应常驻 feature 分支的模块名。
      placeholder: reference-bound fidelity evaluator
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: Epic 目标与成功条件
      description: 说明最终能力、受众和可复核终态；不要在这里声明单个 Stage 已完成。
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: 非目标与权威保留
      description: 写明本 Epic 不改变的科学、权限、数据和发布边界。
    validations:
      required: true

  - type: textarea
    id: stages
    attributes:
      label: 版本化 Stage 计划
      description: 每行使用 stage-slug@vN，列出 Included/Deferred Issues、验收和 rollback unit；普通分支使用 codex/<stage-slug>-vN，Epic 只在 PR metadata 中绑定。
      placeholder: |
        oracle@v1 — Issues #... — 冻结 reference-bound oracle
        corrector@v1 — Issues #... — 可执行 scene patch loop
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: 依赖与顺序
      description: 说明 Stage DAG；相互独立的 Issue 应拆到不同 Stage。
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence invalidation 合同
      description: 至少覆盖 head-change、scope-change、oracle-change，以及模块特有失效条件。
    validations:
      required: true

  - type: textarea
    id: regression
    attributes:
      label: 回归、发布与回滚策略
      description: 定义每个 Stage 的测试面、squash rollback unit、develop 集成和 main 审批边界。
    validations:
      required: true

  - type: dropdown
    id: integration
    attributes:
      label: 是否预期 integration 例外
      description: 仅连通的 R2 Stage 无法在普通分支内安全完成时选择需要；例外分支使用 codex/integration-<stage-slug>-vN，最长 14 天。
      options:
        - 不需要（推荐）
        - 需要，且最长 14 天
    validations:
      required: true

  - type: checkboxes
    id: declaration
    attributes:
      label: 分支纪律
      options:
        - label: 我理解 Epic 是 Issue/模块边界，不是长期 feature 分支。
          required: true
        - label: 每个 Stage 将使用新的 codex/<stage-slug>-vN 分支，Epic 不进入 path，squash 后删除且不复用。
          required: true

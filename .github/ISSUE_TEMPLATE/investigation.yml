name: 调查任务
description: 对尚未证实的异常、架构缺口或跨路线不一致进行有终点的取证
title: "[Investigation] "
body:
  - type: dropdown
    id: primary_area
    attributes:
      label: Primary Area
      description: 只能选择七个规范 Area；Project Area 与后续标签必须镜像该值。
      options:
        - "area:visual-grammar"
        - "area:typography"
        - "area:member-geometry"
        - "area:microasset-fidelity"
        - "area:asset-representation"
        - "area:qa-repair"
        - "area:route-parity"
    validations:
      required: true

  - type: input
    id: parent_epic
    attributes:
      label: Parent Epic
      description: 严格填写一个模块 Epic Issue，例如 #40；治理器会校验该 Issue 存在且带 type:epic 标签。
      placeholder: "#40"
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: 决策问题
      description: 写成调查完成后可以明确回答的问题。
      placeholder: 两条路线为何在同一 reference SHA 下生成不同的 DNA 拓扑合同？
    validations:
      required: true

  - type: textarea
    id: facts
    attributes:
      label: 当前已确认事实
      description: 每条事实都应能追溯到仓库文件、报告、commit 或可重复命令。
    validations:
      required: true

  - type: textarea
    id: hypotheses
    attributes:
      label: 相互竞争的假设
      description: 至少列出可被证伪的假设及其区分证据。
      placeholder: |
        H1：reference oracle 未跨路线冻结；证伪方式：...
        H2：编译器改变拓扑；证伪方式：...
    validations:
      required: true

  - type: textarea
    id: plan
    attributes:
      label: 只读取证计划
      description: 优先列出不会改变候选或基线的检查；需要变更时另开实现 Issue。
    validations:
      required: true

  - type: textarea
    id: outputs
    attributes:
      label: 预期产物
      description: 例如根因结论、证据包、需新建的缺陷 Issue 和应补的门禁。
    validations:
      required: true

  - type: textarea
    id: exit
    attributes:
      label: 退出标准与非目标
      description: 定义何时调查完成；调查 Issue 不直接宣称修复已经交付。
    validations:
      required: true

  - type: dropdown
    id: expected_risk
    attributes:
      label: 若确认缺陷，预计风险
      options:
        - R2 — 科学保真、权限或发布边界
        - R1 — 受限功能或兼容性
        - R0 — 文档或低影响维护
    validations:
      required: true

  - type: checkboxes
    id: separation
    attributes:
      label: 结论纪律
      options:
        - label: 我会区分事实、推断和未知，不用“调查完成”代替“修复完成”。
          required: true

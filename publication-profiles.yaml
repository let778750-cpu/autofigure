# 发表 profile（出版社中性起始值，非具体期刊合规认证）
# 所有字号/公式尺度必须按「最终物理宽度」换算后检查，不能用编辑器放大视图代替。

profiles:
  journal_single_column:
    format_class: paper_figure
    title_policy: external_caption          # 图名由论文 caption 承担，不在图内放巨型标题
    target_width_mm: 89                      # Nature/PNAS 单栏
    min_effective_font_pt: 7.5
    comfortable_font_pt: 8.5
    formula_ink_height_pt: { min: 4.5, max: 10.5 }
    min_formula_text_clearance_mm: 0.8
    min_formula_graphic_clearance_mm: 0.8
    max_semantic_colors_soft: 5
    outer_margin_fraction: { min: 0.025, max: 0.06 }
    line_width_pt: 0.6
    raster_dpi_min: 300
    line_art_dpi_min: 600
    vector_preferred: true                   # PDF/EPS/SVG；禁 JPEG 数据图

  journal_double_column:
    format_class: paper_figure
    title_policy: external_caption
    target_width_mm: 180                     # 双栏方法图
    min_effective_font_pt: 7.0
    comfortable_font_pt: 8.0
    formula_ink_height_pt: { min: 4.5, max: 10.0 }
    min_formula_text_clearance_mm: 0.8
    min_formula_graphic_clearance_mm: 0.8
    max_semantic_colors_soft: 6
    outer_margin_fraction: { min: 0.02, max: 0.05 }
    line_width_pt: 0.6
    raster_dpi_min: 300
    line_art_dpi_min: 600
    vector_preferred: true

  top_conference_method:
    format_class: paper_figure
    title_policy: external_caption
    target_width_mm: 180
    min_effective_font_pt: 7.0
    comfortable_font_pt: 8.0
    formula_ink_height_pt: { min: 4.5, max: 10.0 }
    min_formula_text_clearance_mm: 0.8
    min_formula_graphic_clearance_mm: 0.8
    max_semantic_colors_soft: 6
    priorities:
      - 三秒识别输入、核心方法和输出
      - 核心贡献路径优先于面面俱到
      - 机制资产服务主张，不服务填空

  ppt_presentation:
    format_class: presentation_figure
    title_policy: slide_title_outside_figure
    target_width_mm: 254
    min_effective_font_pt: 12.0
    comfortable_font_pt: 16.0
    formula_ink_height_pt: { min: 7.0, max: 22.0 }
    min_formula_text_clearance_mm: 1.5
    min_formula_graphic_clearance_mm: 1.5
    max_semantic_colors_soft: 6

notes:
  - 这些是起始 profile，不代表具体期刊/会议合规认证。
  - 信息超载时优先减字、拆 panel 或拆图，不要靠低于最小字号解决。
  - 期刊速查表（Nature/Science/IEEE/Elsevier/PNAS/中文核心的逐刊数值）见 references/04-publication-journal-standards.md。
